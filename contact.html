<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/output.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <title>Document</title>
</head>

<body>
    <header class=" flex flex-row items-center   bg-[#F8FAFC] border border-[#E2E8F0] ">
        <a href="index.html"><img src="assest/dodar.png" alt="" class="h-15  w-auto lg:h-20 relative left-4"></a>
        <a href="admin.html"
            class=" flex bg-[#0D73e7] p-1 rounded-xl w-auto h-13 mr-45  my-1 justify-center absolute right-0 "><img
                src="assest/user.svg" alt=""></a>
        <a href="contact.html"
            class=" flex bg-[#0D73e7] p-1 rounded-xl w-auto h-13 mr-25  my-1 justify-center absolute right-0 "><img
                src="assest/contact_support_.svg" alt=""></a>
        <button id="panier-btn"
            class=" flex bg-[#0D73e7] p-1  rounded-xl w-auto h-13 mr-6  my-1 justify-center absolute right-0 "><img
                src="assest/panier.png" alt=""><button>
    </header>
    <main class="bg-[url('/assest/bg-contact.png')] font-['Inter']  h-screen w-full bg-center  flex items-center ">
        <section class="text-xl flex flex-col gap-8 ml-35">
            <div>
                <h1 class="text-6xl font-['Poppins']">contact-nous</h1>
                <p class="text-3xl font-['Poppins']">Nous sommes à votre écoute !</p>
                <p class="text-xl">Une quetion, une suggestion ou un problème ?<br>N'hésitez pas à nous contacter.</p>
            </div>
            <div class="flex flex-col gap-5">
                <div class="flex gap-7 pl-5 rounded-2xl bg-[#b1D0EB] items-center py-1">
                    <img src="assest/call_24dp_FFF_FILL1_wght400_GRAD0_opsz48.svg" alt=""
                        class="bg-[#0D73e7] h-10 w-auto rounded-xl">
                    <div>
                        <p>téléphne</p>
                        <p>+212 6 50 60 58 93</p>
                    </div>
                </div>
                <div class="flex gap-7 pl-5 rounded-2xl items-center bg-[#b1D0EB] py-1">
                    <img src="assest/mail_24dp_FFF_FILL1_wght400_GRAD0_opsz24.svg" alt=""
                        class="bg-[#0D73e7] h-10 w-auto rounded-xl">
                    <div>
                        <p>Email</p>
                        <p>contact@dodrarmarket.ma</p>
                    </div>
                </div>
                <div class="flex gap-7 pl-5 rounded-2xl bg-[#b1D0EB] items-center py-1">
                    <img src="assest/location_on_24dp_FFF_FILL1_wght400_GRAD0_opsz24.svg" alt=""
                        class="bg-[#0D73e7] h-10 w-auto rounded-xl">
                    <div>
                        <p>Adresse</p>
                        <p>Tata, Maroc</p>
                    </div>
                </div>
            </div>
            <div>
                <h3 class="font-['Poppins'] text-2xl">Suivez-nous</h3>
                <div class="flex gap-5">
                    <a href="https://www.facebook.com/share/1QzGmU3Hko/"><img src="assest/communication.png" alt="" class="h-15"></a>
                    <a href="https://www.instagram.com/odouche_abdo1?exln=MTBhdXkzdHBqOXZ2cg=="><img src="assest/instagram.png" alt="" class="h-15"></a>
                    <a href="assest/user.svg"><img src="assest/youtube.png" alt="" class="h-15"></a>
                </div>
            </div>
        </section>
        <img src="assest/chab.png" alt="" class="h-80 absolute left-100">
        <section class="sm: lg:text-xl bg-[#ffff] absolute right-15 flex flex-col gap-15 p-5 mb-10 rounded-2xl border border-[#b1D0EB] ">
            <div class="flex gap-3">
                <img src="assest/mail_24dp_0D73E7_FILL1_wght400_GRAD0_opsz24.svg" alt="" class="h-10">
                <h2 class="text-4xl font-['Poppins']">Envoyez-nous un message</h2>
            </div>
            <form id="form" action="" class="flex flex-col gap-6 justify-center">
                <div class="flex gap-5">
                    <div class="flex flex-col gap-3">
                        <label for="" >Nom complet <span class="text-red-700">*</span></label>
                        <input type="text" id="name" placeholder="Votre nom" class="bg-[#b1D0EB] rounded-2xl h-10 pl-4" >
                        <span class="msg text-red-600" id="msg-name"></span>
                    </div>
                    <div class="flex flex-col gap-3">
                        <label for="" >Email <span class="text-red-700">*</span></label>
                        <input type="email" id="email" placeholder="Votre email" class="bg-[#b1D0EB] rounded-2xl h-10 pl-4 " >
                        <span class="msg text-red-600" id="msg-email"></span>
                    </div>
                </div>
                <div class="flex flex-col gap-3">
                    <label for="">Message <span class="text-red-700">*</span></label>
                    <textarea placeholder="Ecrivez votre message" name="" id=""
                        class="bg-[#b1D0EB] rounded-2xl h-50 pl-4" ></textarea>
                </div>
                <div class="flex justify-center">
                    <button type="submit" id="submitbtn" class="bg-[#0D73e7] h-10 w-90 rounded-2xl"><img src="" alt="">Envoyer le message</button>
                </div>
            </form>
        </section>
    </main>
</body>
<script type="module" src="js/validation.js"></script>

</html>
